          format: date-time
        reason:
          type: string
      required:
      - id
      - starts_at
      - ends_at
    AppointmentType:
      type: object
      description: Lower estimate must be nonnegative; appointment reservation uses standard_minutes+tolerance_minutes.
      properties:
        code:
          type: string
          enum:
          - ROUTINE_CHECKUP
          - VACCINATION
          - ILLNESS
          - FOLLOW_UP
          - OTHER
        standard_minutes:
          type: integer
          minimum: 10
          example: 30
        tolerance_minutes:
          type: integer
          minimum: 0
          example: 10
      required:
      - code
      - standard_minutes
      - tolerance_minutes
    AppointmentTypeList:
      type: array
      items:
        $ref: '#/components/schemas/AppointmentType'
    AppointmentPetInput:
      type: object
      properties:
        pet_id:
          type: string
          example: pet-1
        visit_type:
          type: string
          enum:
          - ROUTINE_CHECKUP
          - VACCINATION
          - ILLNESS
          - FOLLOW_UP
          - OTHER
        custom_visit_reason:
          type: string
          description: Required (non-blank) when visit_type is OTHER.
          pattern: \S
          minLength: 1
        notes:
          type: string
          description: Optional per-pet symptom description or notes.
      required:
      - pet_id
      - visit_type
      allOf:
      - if:
          properties:
            visit_type:
              const: OTHER
          required:
          - visit_type
        then:
          required:
          - custom_visit_reason
    AppointmentSearchRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        pets:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentPetInput'
          minItems: 1
      required:
      - date
      - pets
    AppointmentSlot:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        estimated_min_minutes:
          type: integer
          minimum: 0
        estimated_max_minutes:
          type: integer
          minimum: 10
        reserved_minutes:
          type: integer
          minimum: 10
      required:
      - starts_at
      - estimated_min_minutes
      - estimated_max_minutes
      - reserved_minutes
    AppointmentSlotList:
      type: array
      items:
        $ref: '#/components/schemas/AppointmentSlot'
    NewAppointment:
      type: object
      description: 'Owner submits a request for one or more pets. The client cannot set a status: the server always
        creates the request as PENDING_APPROVAL. Submission does not confirm the visit. Only the veterinarian can
        approve or reject it (POST /appointments/{appointmentId}/decision); approval rechecks availability.'
      properties:
        starts_at:
          type: string
          format: date-time
          example: '2026-11-05T10:00:00+03:00'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentPetInput'
          minItems: 1
      required:
      - starts_at
      - pets
      additionalProperties: false
    Appointment:
      type: object
      description: An appointment request starts PENDING_APPROVAL. The veterinarian alone decides whether it becomes
        CONFIRMED or REJECTED. A confirmed appointment can later be CANCELLED by the veterinarian, or rescheduled
        (status stays CONFIRMED, starts_at changes). reserved_minutes is the calculated required block (upper duration);
        for pending requests, it does not guarantee a temporary hold. The pending-hold policy is a team decision.
      properties:
        id:
          type: string
          example: appt-1
        owner_id:
          type: string
          example: owner-1
        starts_at:
          type: string
          format: date-time
        reserved_minutes:
          type: integer
          description: Continuous time required if this request is approved; a pending request is not necessarily
            held.
        estimated_min_minutes:
          type: integer
        estimated_max_minutes:
          type: integer
        status:
          type: string
          enum:
          - PENDING_APPROVAL
          - CONFIRMED
          - REJECTED
          - CANCELLED
          readOnly: true
          description: Server-controlled. New requests are always PENDING_APPROVAL; only the veterinarian decision
            operation moves them to CONFIRMED or REJECTED.
        pets:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentPetInput'
      required:
      - id
      - owner_id
      - starts_at
      - reserved_minutes
      - estimated_min_minutes
      - estimated_max_minutes
      - status
      - pets
    AppointmentList:
      type: array
      items:
        $ref: '#/components/schemas/Appointment'
    ManageAppointmentRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - CANCEL
          - RESCHEDULE
        new_starts_at:
          type: string
          format: date-time
          description: Required when action=RESCHEDULE.
      required:
      - action
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - APPOINTMENT_UPDATED
          - APPOINTMENT_CANCELLED
          - APPOINTMENT_APPROVED
          - APPOINTMENT_REJECTED
        message:
          type: string
        appointment_id:
          type: string
        new_starts_at:
          type: string
          format: date-time
        read:
          type: boolean
      required:
      - id
      - type
      - message
      - read
    NotificationList:
      type: array
      items:
        $ref: '#/components/schemas/Notification'
    ThemePreference:
      type: object
      properties:
        theme:
          type: string
          enum:
          - LIGHT
          - DARK
          default: LIGHT
      required:
      - theme
    ClinicContact:
      type: object
      properties:
        phone_number:
          type: string
          example: +90 312 000 00 00
          description: Example only; replace with real clinic number.
        display_message:
          type: string
          example: For urgent concerns, please phone the clinic directly.
      required:
      - phone_number
    Problem:
      type: object
      description: Standardized API error body.
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          example: SLOT_UNAVAILABLE
        detail:
          type: string
      required:
      - title
      - status
      - code
    AppointmentDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
      required:
      - decision
    UnavailablePeriodUpdate:
      type: object
      description: Partial edit; only provided fields change. ends_at must be after starts_at.
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
      minProperties: 1
    UnavailablePeriodList:
      type: array
      items:
        $ref: '#/components/schemas/UnavailablePeriod'
    NotificationReadUpdate:
      type: object
      additionalProperties: false
      properties:
        read:
          type: boolean
      required:
      - read
  responses:
    BadRequest:
      description: Invalid request syntax or parameters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Invalid request syntax or parameters
            status: 400
            code: BADREQUEST
            detail: Invalid request syntax or parameters
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Missing or invalid authentication
            status: 401
            code: UNAUTHORIZED
            detail: Missing or invalid authentication
    Forbidden:
      description: Role or ownership does not allow this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Role or ownership does not allow this operation
            status: 403
            code: FORBIDDEN
            detail: Role or ownership does not allow this operation
    NotFound:
      description: Resource not found or not visible to current user
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Resource not found or not visible to current user
            status: 404
            code: NOTFOUND
            detail: Resource not found or not visible to current user
    Conflict:
      description: Generic resource conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            code: CONFLICT
            detail: The request conflicts with the current state of the resource.
    Unprocessable:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Request validation failed
            status: 422
            code: VALIDATION_ERROR
            detail: Request validation failed
    SlotUnavailable:
      description: Selected interval conflicts with a confirmed appointment or a blocked period
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Slot unavailable
            status: 409
            code: SLOT_UNAVAILABLE
            detail: The selected interval is no longer available.
    EmailAlreadyExists:
      description: An account with this email already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Email already exists
            status: 409
            code: EMAIL_ALREADY_EXISTS
            detail: An account with this email already exists.
    UnavailablePeriodOverlap:
      description: Blocked period overlaps another blocked period
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unavailable period overlap
            status: 409
            code: UNAVAILABLE_PERIOD_OVERLAP
            detail: The period overlaps an existing blocked period.
    AppointmentConflict:
      description: Appointment is in the wrong state, or the interval conflicts with a confirmed booking
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            slotConflict:
              value:
                title: Slot unavailable
                status: 409
                code: SLOT_UNAVAILABLE
                detail: The requested interval conflicts with another confirmed appointment.
            invalidState:
              value:
                title: Invalid appointment state
                status: 409
                code: INVALID_STATE
                detail: This operation is not allowed for the appointment's current status.
