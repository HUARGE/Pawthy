      description: Only the veterinarian may create appointments. Minimum 10 minutes. Check weekly working 
        hours, blocked periods, and overlap with active appointments. Owner cannot submit online requests. 
        The veterinarian may select the start/end range directly in the visual day/week calendar; 
        appointments are rendered as BUSY blocks. Reject overlapping active appointments with 409. No owner 
