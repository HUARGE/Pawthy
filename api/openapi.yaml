      description: Veterinarian views clinic-wide appointments; pet owners may view only their own recorded 
        appointments. Includes cancelled history on request. Sorted by starts_at. No approval queue. The 
        veterinarian may select the start/end range directly in the visual day/week calendar; appointments 
        are rendered as BUSY blocks. Reject overlapping active appointments with 409. No owner self-booking 
        or approval workflow.
