        schema:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
        description: Filter by status.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Only appointments starting at or after this time.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Only appointments starting before this time.
      - name: owner_id
        in: query
        required: false
        schema:
          type: string
        description: 'Veterinarian only: filter by owner. Ignored for owners.'
