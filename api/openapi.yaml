openapi: 3.1.0
info:
  title: Pawthy — Pet Health Portal API
  version: 0.6.3
  description: 'Draft API-first contract for SENG 321 Sprint 1. Single clinic and one veterinarian/administrator.
    Revised US-11 and US-12: the veterinarian configures recurring weekly working hours, exceptional blocked periods,
    clinic contact information, and manually records appointments arranged by telephone or in person. Pet owners
    can only view the privacy-safe availability calendar and contact the clinic. Online appointment requests and
    approval/rejection workflows are not supported. Appointments have start and end times, at least 10 minutes
    duration, and one or more pets. Cancelled appointments remain in history but no longer occupy calendar time.
    The calendar combines working hours, blocked periods and non-cancelled appointments. All times are Europe/Istanbul,
    represented as ISO 8601 timestamps with offsets. No billing, external SMS/email or automated diagnosis. These
    are proposed contracts, not implemented endpoints.


    Conventions: Bearer token authentication unless an operation specifies security: []. x-roles lists authorized
    roles. Unauthorized role -> 403; another owner''s private resource -> 404. List operations use items/next_cursor
    and limit/cursor. Validation errors use application/problem+json. The veterinarian must not publish owner
    identities or visit details in the public availability response.


    Changes v0.6.0: aligned US-11/US-12 to Updated User Stories: removed online booking, PENDING_APPROVAL/REJECTED
    and decision operation; added recurring weekly schedule, blocked periods, public availability, veterinary
    manual appointment creation and edits, explicit ends_at and minimum 10-minute duration. Preserved unrelated
    endpoints. Appointment notifications were removed because changes are communicated through existing clinic
    contact methods.


    Changes v0.6.1: removed the pet-owner symptom/diary entry feature (US-05), including symptom catalogue, observation
    CRUD and observation statistics (US-06), plus their unused schemas. Veterinary medical records remain available
    and unchanged.


    Changes v0.6.2 (new US-11/US-12): simple day/week visual calendar backed by explicit AVAILABLE and BUSY availability
    blocks. Veterinarian may select time ranges, create/edit/delete blocks and create/edit/cancel appointments.
    Public calendar remains read-only and privacy-safe. No drag-and-drop, external calendar sync, automatic slot
    generation or online booking.


    Changes v0.6.3: restored owner-entered Daily Health Diary functions (US-05 and US-06), including the symptom
    catalogue, optional timestamped health observations, owner-only create/edit/delete, veterinarian read-only
    access, chronological and calendar-based history data, and symptom-frequency/timeline statistics. Unrecorded
    days are not assumed healthy; results are informational, not diagnostic. Kept the v0.6.2 veterinarian-managed
    visual calendar and manual-appointment workflow. Aligned story references to the final 13-story backlog: appointment
    management is US-12 and Light/Dark Theme is US-13.

    '
servers:
- url: /api/v1
  description: Proposed Django API prefix (subject to team confirmation)
tags:
- name: Authentication
- name: Owner Accounts
- name: Pets
- name: Diary
- name: Medical Records
- name: Vaccinations
- name: Reminders
- name: Busy Times
- name: Appointments
- name: Availability
- name: Preferences
- name: Clinic
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Log in with assigned credentials
      x-roles:
      - PUBLIC
      x-user-stories:
      - US-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated (first login may require password change)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                access_token: example-token
                must_change_password: true
                role: PET_OWNER
                expires_in: 3600
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/change-password:
    post:
      tags:
      - Authentication
      operationId: changeFirstPassword
      summary: Change password, including required first-login change
      description: Wrong current_password or a new password equal to the current one returns 422 with a 
        field error. Succeeding clears must_change_password and invalidates the previous temporary password 
        and tokens issued before the change.
      x-roles:
      - PET_OWNER
      - VETERINARIAN
      x-user-stories:
      - US-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Successful operation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pet-owners:
    post:
      tags:
      - Owner Accounts
      operationId: createPetOwner
      summary: Veterinarian creates a pet-owner account
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerAccountRequest'
      responses:
        '201':
          description: Account created; temporary password returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProvisioned'
              example:
                owner:
                  id: owner-1
                  full_name: Ayse Demir
                  email: owner@example.com
                temporary_password: shown-once-example
                shown_once: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/EmailAlreadyExists'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags:
      - Owner Accounts
      operationId: listPetOwners
      summary: List pet owners for veterinarian dashboard
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-01
      - US-03
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Search by name or e-mail.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: List of owner accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /species:
    get:
      tags:
      - Pets
      operationId: listSpecies
      summary: List common pet species, with Other option
      x-roles:
      - PET_OWNER
      - VETERINARIAN
      x-user-stories:
      - US-04
      - US-09
      responses:
        '200':
          description: Species catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /symptoms:
    get:
      tags:
      - Diary
      operationId: listSymptoms
      summary: List predefined symptom catalogue
      description: Symptoms grouped by category. Codes ending in _OTHER (for example DIGESTIVE_OTHER) 
        require custom_description in an observation.
      x-roles:
      - PET_OWNER
      - VETERINARIAN
      x-user-stories:
      - US-05
      responses:
        '200':
          description: Symptom catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymptomList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pets:
    get:
      tags:
      - Pets
      operationId: listAccessiblePets
      summary: List pets available to current user
      x-roles:
      - PET_OWNER
      - VETERINARIAN
      x-user-stories:
      - US-03
      - US-04
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Include pets the owner archived.
      - name: clinical_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - DECEASED
          - NO_LONGER_AT_CLINIC
        description: Filter by clinical status.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pets belonging to current owner or assigned clinic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pet-owners/{ownerId}/pets:
    post:
      tags:
      - Pets
      operationId: createPetProfile
      summary: Veterinarian adds a pet under an owner account
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-04
      parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags:
      - Pets
      operationId: listOwnerPets
      summary: Veterinarian lists the pets of one owner
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-03
      - US-04
      parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Include pets the owner archived.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pets of the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pets/{petId}:
    get:
      tags:
      - Pets
      operationId: getPetProfile
      summary: View pet profile
      x-roles:
      - PET_OWNER
      - VETERINARIAN
      x-user-stories:
      - US-03
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      responses:
        '200':
          description: Pet profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Pets
      operationId: updateVeterinaryPetProfile
      summary: Veterinarian updates veterinary-controlled pet profile fields
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VetPetUpdate'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pets/{petId}/personal-details:
    get:
      tags:
      - Pets
      operationId: getPersonalPetDetails
      summary: Owner views their private pet notes
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      responses:
        '200':
          description: Owner-only notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPersonalDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Pets
      operationId: updatePersonalPetDetails
      summary: Owner edits their private pet notes
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetPersonalDetails'
      responses:
        '200':
          description: Owner-only notes updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPersonalDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pets/{petId}/archive:
    patch:
      tags:
      - Pets
      operationId: archivePetForOwner
      summary: Owner archives or restores a pet in personal list
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetArchiveRequest'
      responses:
        '200':
          description: Archive visibility updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pets/{petId}/photos:
    get:
      tags:
      - Pets
      operationId: listPersonalPetPhotos
      summary: Owner lists their private pet photos
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      responses:
        '200':
          description: Private photo gallery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPhotoList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Pets
      operationId: uploadPersonalPetPhoto
      summary: Owner uploads a personal pet photo
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPhoto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pets/{petId}/photos/{photoId}:
    delete:
      tags:
      - Pets
      operationId: deletePersonalPetPhoto
      summary: Owner deletes one personal pet photo
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      - name: photoId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful operation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pets/{petId}/clinical-photo:
    put:
      tags:
      - Pets
      operationId: uploadClinicalPetPhoto
      summary: Veterinarian uploads or replaces the clinical identification photo
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-04
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        '200':
          description: Pet photo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pets/{petId}/observations:
    get:
      tags:
      - Diary
      operationId: listObservations
      summary: Review diary entries for an authorized pet
      x-roles:
      - PET_OWNER
      - VETERINARIAN
      x-user-stories:
      - US-05
      - US-06
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      - name: from_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Only entries observed on or after this date (clinic time zone).
      - name: to_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Only entries observed on or before this date.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries sorted by observed_at, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Diary
      operationId: createObservation
      summary: Owner records an optional, symptom-focused observation
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-05
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationInput'
      responses:
        '201':
          description: Observation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
              example:
                id: obs-1
                pet_id: pet-1
                created_by_owner_id: owner-1
                observed_at: '2026-11-02T10:30:00+03:00'
                observations:
                - category: DIGESTIVE
                  symptom_code: DIARRHEA
                normal_no_concerns: false
                notes: Soft stool this morning.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pets/{petId}/observations/{observationId}:
    patch:
      tags:
      - Diary
      operationId: updateObservation
      summary: Owner edits an observation they created
      description: Returns 422 if the edited entry would have no observation item, no Normal / No Concerns 
        flag and no note.
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-05
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      - name: observationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationUpdate'
      responses:
        '200':
          description: Observation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Diary
      operationId: deleteObservation
      summary: Owner deletes an observation they created
      x-roles:
      - PET_OWNER
      x-user-stories:
      - US-05
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      - name: observationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful operation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pets/{petId}/observation-statistics:
    get:
      tags:
      - Diary
      operationId: getObservationStatistics
      summary: Symptom frequency and timeline for authorized user
      x-roles:
      - PET_OWNER
      - VETERINARIAN
      x-user-stories:
      - US-06
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
        description: ID of a pet authorized for the current user.
      - name: from_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to_date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Owner-reported symptom counts and timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pets/{petId}/medical-records:
    get:
      tags:
      - Medical Records
      operationId: listMedicalRecords
      summary: View veterinary medical history (read-only for owners)
      x-roles:
      - PET_OWNER
      - VETERINARIAN
      x-user-stories:
      - US-07
      - US-08
      parameters:
      - name: petId
