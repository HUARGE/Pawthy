    ReminderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VaccinationReminder'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page.
      required:
      - items
      - next_cursor
    AppointmentPetInput:
      type: object
      properties:
        pet_id:
          type: string
          example: pet-1
        visit_type:
          type: string
          enum:
          - ROUTINE_CHECKUP
          - VACCINATION
          - ILLNESS
          - FOLLOW_UP
          - OTHER
          description: Optional reason category.
        custom_visit_reason:
          type: string
          description: Required (non-blank) when visit_type is OTHER.
          pattern: \S
          minLength: 1
        notes:
          type: string
          description: Optional per-pet symptom description or notes.
      required:
      - pet_id
      allOf:
      - if:
          properties:
            visit_type:
              const: OTHER
          required:
          - visit_type
        then:
          required:
          - custom_visit_reason
      description: A pet included in a veterinarian-recorded appointment. Must belong to selected owner and 
        be ACTIVE. No duplicate pet IDs.
    Appointment:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
          readOnly: true
        pets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AppointmentPet'
        visit_reason:
          type: string
        notes:
          type: string
          description: Veterinarian only; omit for pet owner responses.
        owner_name:
          type: string
          description: Veterinarian only; omit for owner responses when not needed.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - owner_id
      - starts_at
      - ends_at
      - status
      - pets
      - created_at
      description: Veterinarian-created appointment; never a pending online request. Owners may view only 
        their own records. The public calendar only exposes BUSY intervals.
    AppointmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page.
      required:
      - items
      - next_cursor
    ThemePreference:
      type: object
      properties:
        theme:
          type: string
          enum:
          - LIGHT
          - DARK
          default: LIGHT
      required:
      - theme
    ClinicContact:
      type: object
      properties:
        phone_number:
          type: string
          example: +90 312 000 00 00
          description: Example only; replace with real clinic number.
        display_message:
          type: string
          example: For urgent concerns, please phone the clinic directly.
      required:
      - phone_number
    Problem:
      type: object
      description: Standardized API error body.
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - PASSWORD_CHANGE_REQUIRED
          - NOT_FOUND
          - VALIDATION_ERROR
          - EMAIL_ALREADY_EXISTS
          - INVALID_STATE
          - TOO_MANY_REQUESTS
          example: VALIDATION_ERROR
        detail:
          type: string
        errors:
          type: array
          description: Field-level validation details (present on 422).
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - title
      - status
      - code
    FieldError:
      type: object
      properties:
        field:
          type: string
          example: starts_at
        code:
          type: string
          example: TIME_BUSY
          description: Field-level code, e.g. REQUIRED, PAST_TIME, FUTURE_TIME, TIME_BUSY, DUPLICATE_PET, 
            PET_NOT_ACTIVE, INVALID_TIME_RANGE, INVALID_CURRENT_PASSWORD, PREVIOUS_VACCINATION_INVALID.
        message:
          type: string
      required:
      - field
      - code
      - message
    AppointmentPet:
      type: object
      properties:
        pet_id:
          type: string
          example: pet-1
        pet_name:
          type: string
          readOnly: true
          example: Luna
        visit_type:
          type: string
          enum:
          - ROUTINE_CHECKUP
          - VACCINATION
          - ILLNESS
          - FOLLOW_UP
          - OTHER
        custom_visit_reason:
          type: string
        notes:
          type: string
      required:
      - pet_id
      - visit_type
    BusyTimeInput:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          description: Private note for the veterinarian; never shown to owners.
      required:
      - starts_at
      - ends_at
      description: Veterinarian-managed exceptional blocked time (leave, holidays or other commitments). Not
        a recurring weekly schedule. Time range is half-open [starts_at, ends_at). Must have ends_at > 
        starts_at.
    BusyTime:
      type: object
      properties:
        id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          description: Present only for the veterinarian; omitted for owners.
      required:
      - id
      - starts_at
      - ends_at
      description: Veterinarian-managed exceptional blocked time (leave, holidays or other commitments). Not
        a recurring weekly schedule. Time range is half-open [starts_at, ends_at). Must have ends_at > 
        starts_at.
    BusyTimeUpdate:
      type: object
      description: Veterinarian-managed exceptional blocked time (leave, holidays or other commitments). Not
        a recurring weekly schedule. Time range is half-open [starts_at, ends_at). Must have ends_at > 
        starts_at.
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
      minProperties: 1
    BusyTimeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusyTime'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page.
      required:
      - items
      - next_cursor
    WeeklyWorkingPeriod:
      type: object
      additionalProperties: false
      properties:
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, Monday=1, Sunday=7
        start_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 09:00
        end_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '17:00'
      required:
      - day_of_week
      - start_time
      - end_time
      description: Local clinic times; end_time must be after start_time. Multiple non-overlapping periods 
        per day allowed.
    WeeklySchedule:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          const: Europe/Istanbul
        periods:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyWorkingPeriod'
      required:
      - timezone
      - periods
      description: Veterinarian-controlled recurring weekly working hours. An empty periods array means no 
        regular opening hours.
    AvailabilityInterval:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - CLOSED
      required:
      - starts_at
      - ends_at
      - status
      additionalProperties: false
    AvailabilityCalendar:
      type: object
      properties:
        timezone:
          type: string
          const: Europe/Istanbul
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityInterval'
        clinic_phone_number:
          type: string
        view:
          type: string
          enum:
          - day
          - week
      required:
      - timezone
      - intervals
      - clinic_phone_number
      description: Privacy-safe view derived from weekly hours, exceptional blocks and confirmed 
        non-cancelled appointments. Never includes owner names, pet details, private notes or reasons. 
        Day/week view is rendered by frontend from returned time intervals. Explicit AVAILABLE/BUSY blocks 
        override the weekly baseline; confirmed appointments always appear BUSY. No personal details.
    ManualAppointmentInput:
      type: object
      additionalProperties: false
      properties:
        owner_id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        pets:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AppointmentPetInput'
        visit_reason:
          type: string
          description: Optional overall reason for visit.
        notes:
          type: string
          description: Private veterinary notes.
      required:
      - owner_id
      - starts_at
      - ends_at
      - pets
      description: Veterinarian records an appointment already arranged by phone or in person. Duration must
        be at least 10 minutes, end > start, and time must fit the clinic availability (weekly hours, 
        blocked periods and existing active appointments). The backend enforces non-overlap.
    AppointmentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        pets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AppointmentPetInput'
        visit_reason:
          type: string
        notes:
          type: string
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
      description: Veterinarian edits, reschedules or cancels an appointment. If only one time bound is 
        supplied, use the unchanged other bound and validate at least 10 minutes. Cancelled appointments 
        remain in history and free their time slot. Reconfirming a cancelled appointment requires 
        revalidation of availability.
    AvailabilityBlockInput:
      type: object
      additionalProperties: false
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
        note:
          type: string
          description: Veterinarian-only optional note; never in public calendar.
      required:
      - starts_at
      - ends_at
      - status
      description: Explicit time block selected on the visual calendar. End must be later than start. 
        AVAILABLE may mark an exception to recurring hours; BUSY overrides availability. Reject conflicting 
        explicit blocks with 409. No automatic slot generation.
    AvailabilityBlock:
      allOf:
      - $ref: '#/components/schemas/AvailabilityBlockInput'
      - type: object
        properties:
          id:
            type: string
        required:
        - id
      description: Veterinarian-managed time block; includes optional private note only in veterinarian 
        responses.
    AvailabilityBlockUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
        note:
          type: string
          description: Veterinarian-only optional note; never in public calendar.
      description: Edit one or more properties; validate effective start/end and reject 
        overlapping/conflicting blocks.
    AvailabilityBlockList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityBlock'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
    VeterinarianCalendarEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - AVAILABILITY_BLOCK
          - APPOINTMENT
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
        appointment:
          $ref: '#/components/schemas/Appointment'
        note:
          type: string
      required:
      - id
      - kind
      - starts_at
      - ends_at
      - status
      description: Private administrative calendar item. appointment appears only for APPOINTMENT events; 
        owner-facing calendar never uses this schema.
    VeterinarianCalendar:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          const: Europe/Istanbul
        view:
          type: string
          enum:
          - day
          - week
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityInterval'
        events:
          type: array
          items:
            $ref: '#/components/schemas/VeterinarianCalendarEvent'
      required:
      - timezone
      - view
      - from
      - to
      - intervals
      - events
      description: Administrative day/week calendar. Intervals are display ranges, not automatically 
        bookable slots. Appointment events include details only for veterinarian.
  responses:
    BadRequest:
      description: Invalid request syntax or parameters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Invalid request syntax or parameters
            status: 400
            code: BAD_REQUEST
            detail: Invalid request syntax or parameters
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Missing or invalid authentication
            status: 401
            code: UNAUTHORIZED
            detail: Missing or invalid authentication
    Forbidden:
      description: Role does not allow this operation, or a first-login password change is still required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            roleForbidden:
              value:
                title: Forbidden
                status: 403
                code: FORBIDDEN
                detail: Your role does not allow this operation.
            passwordChangeRequired:
              value:
                title: Password change required
                status: 403
                code: PASSWORD_CHANGE_REQUIRED
                detail: Change the temporary password before using the application.
    NotFound:
      description: Resource does not exist or belongs to another owner (ownership failures return 404, not 
        403)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Resource not found
            status: 404
            code: NOT_FOUND
            detail: Resource not found or not visible to current user.
    Unprocessable:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Request validation failed
            status: 422
            code: VALIDATION_ERROR
            detail: One or more fields are invalid.
            errors:
            - field: starts_at
              code: PAST_TIME
              message: The requested time is in the past.
    EmailAlreadyExists:
      description: An account with this email already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Email already exists
            status: 409
            code: EMAIL_ALREADY_EXISTS
            detail: An account with this email already exists.
    AppointmentConflict:
      description: Overlapping active appointment, unavailable time, or invalid appointment state (409).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Appointment conflict
            status: 409
            code: APPOINTMENT_OVERLAP
            detail: The selected interval overlaps another confirmed appointment.
    TooManyRequests:
      description: Too many attempts; retry later
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Too many requests
            status: 429
            code: TOO_MANY_REQUESTS
            detail: Too many failed attempts. Try again later.
    CalendarBlockConflict:
      description: Conflicting explicit availability blocks or an invalid calendar state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum number of items per page.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from a previous next_cursor value.
