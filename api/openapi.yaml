          $ref: '#/components/responses/Forbidden'
        '422': &id004
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - Availability
      operationId: createAvailabilityBlock
      summary: Veterinarian marks a selected time range Available or Busy
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityBlockInput'
      description: Calendar selection supplies starts_at and ends_at; end must be later than start. Busy 
        blocks override available blocks. Explicit overlapping blocks are rejected; existing confirmed 
        appointments always remain busy.
      responses:
        '201':
          description: Block created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityBlock'
        '409':
          $ref: '#/components/responses/CalendarBlockConflict'
        '401': *id002
        '403': *id003
        '422': *id004
  /availability/blocks/{blockId}:
    patch:
      tags:
      - Availability
      operationId: updateAvailabilityBlock
      summary: Veterinarian edits an availability block
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-11
      parameters:
      - name: blockId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityBlockUpdate'
      responses:
        '200':
          description: Updated block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityBlock'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CalendarBlockConflict'
        '401': *id002
        '403': *id003
        '422': *id004
    delete:
      tags:
      - Availability
      operationId: deleteAvailabilityBlock
      summary: Veterinarian removes an availability block
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-11
      parameters:
      - name: blockId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Block removed
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /veterinarian/calendar:
    get:
      tags:
      - Availability
      operationId: getVeterinarianVisualCalendar
      summary: Veterinarian views day/week calendar with private appointment details
      x-roles:
      - VETERINARIAN
      x-user-stories:
      - US-11
      - US-12
      description: Calendar frontend supports day/week time-grid selection; no drag-and-drop or external 
        sync. Displays weekly hours, explicit availability blocks, blocked periods and confirmed 
        appointments. Cancelled appointments do not occupy time.
      parameters:
      - name: view
        in: query
        required: true
        schema:
          type: string
          enum:
          - day
          - week
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Local Europe/Istanbul date anchoring the day or ISO week.
      responses:
        '200':
          description: Administrative calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeterinarianCalendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Proposed API authentication; final Django authentication scheme to be agreed.
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: owner@example.com
        password:
          type: string
          format: password
      required:
      - email
      - password
    LoginResult:
      type: object
      properties:
        access_token:
          type: string
          description: Session/API access token.
        must_change_password:
          type: boolean
          example: true
          description: While true, only change-password and logout are allowed; other operations return 403 
            PASSWORD_CHANGE_REQUIRED.
        role:
          type: string
          enum:
          - PET_OWNER
          - VETERINARIAN
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 3600
      required:
      - access_token
      - must_change_password
      - role
      - expires_in
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
      required:
      - current_password
      - new_password
    OwnerAccountRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Ayse Demir
        email:
          type: string
          format: email
          example: owner@example.com
      required:
      - full_name
      - email
    OwnerAccount:
      type: object
      properties:
        id:
          type: string
          example: owner-1
        full_name:
          type: string
        email:
          type: string
          format: email
      required:
      - id
      - full_name
      - email
    OwnerProvisioned:
      type: object
      properties:
        owner:
          $ref: '#/components/schemas/OwnerAccount'
        temporary_password:
          type: string
          description: Returned only once to the veterinarian for in-person handover; never returned in 
            normal account reads.
        shown_once:
          type: boolean
          const: true
      required:
      - owner
      - temporary_password
      - shown_once
    OwnerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnerAccount'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page.
      required:
      - items
      - next_cursor
    SpeciesOption:
      type: object
      properties:
        code:
          type: string
          example: CAT
        display_name:
          type: string
          example: Cat
        supports_predefined_vaccines:
          type: boolean
      required:
      - code
      - display_name
      - supports_predefined_vaccines
    SpeciesList:
      type: array
      items:
        $ref: '#/components/schemas/SpeciesOption'
    NewPet:
      type: object
      properties:
        name:
          type: string
          example: Luna
        species_code:
          type: string
          example: CAT
          description: Use OTHER for species outside predefined choices.
        other_species_name:
          type: string
          description: Required (non-blank) when species_code is OTHER.
          pattern: \S
          minLength: 1
        breed:
          type: string
        date_of_birth:
          type: string
          format: date
        estimated_age_months:
          type: integer
          minimum: 0
        sex:
          type: string
          enum:
          - FEMALE
          - MALE
          - UNKNOWN
        microchip_number:
          type: string
      required:
      - name
      - species_code
      - sex
      allOf:
      - if:
          properties:
            species_code:
              const: OTHER
          required:
          - species_code
        then:
          required:
          - other_species_name
    VetPetUpdate:
      type: object
      description: Veterinarian-controlled identity and clinical-status fields only.
      properties:
        name:
          type: string
        species_code:
          type: string
        other_species_name:
          type: string
          pattern: \S
          minLength: 1
          description: Required (non-blank) when species_code is OTHER.
        breed:
          type: string
        date_of_birth:
          type: string
          format: date
        estimated_age_months:
          type: integer
          minimum: 0
        sex:
          type: string
          enum:
          - FEMALE
          - MALE
          - UNKNOWN
        microchip_number:
          type: string
        clinical_status:
          type: string
          enum:
          - ACTIVE
          - DECEASED
          - NO_LONGER_AT_CLINIC
      allOf:
      - if:
          properties:
            species_code:
              const: OTHER
          required:
          - species_code
        then:
          required:
          - other_species_name
    Pet:
      type: object
      properties:
        id:
          type: string
          example: pet-1
        owner_id:
          type: string
          example: owner-1
        name:
          type: string
          example: Luna
        species_code:
          type: string
          example: CAT
        other_species_name:
          type: string
        breed:
          type: string
        date_of_birth:
          type: string
          format: date
        estimated_age_months:
          type: integer
        sex:
          type: string
          enum:
          - FEMALE
          - MALE
          - UNKNOWN
        microchip_number:
          type: string
        clinical_photo_url:
          type: string
          format: uri
          description: 'Same access rule as personal photos: authenticated route or signed URL.'
        clinical_status:
          type: string
          enum:
          - ACTIVE
          - DECEASED
          - NO_LONGER_AT_CLINIC
        archived_by_owner:
          type: boolean
          default: false
      required:
      - id
      - owner_id
      - name
      - species_code
      - sex
      - clinical_status
      - archived_by_owner
    PetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page.
      required:
      - items
      - next_cursor
    PetPersonalDetails:
      type: object
      properties:
        personal_notes:
          type: string
          description: Owner-only notes. Not returned to the veterinarian.
    PetArchiveRequest:
      type: object
      properties:
        archived:
          type: boolean
      required:
      - archived
    PetPhoto:
      type: object
      properties:
        id:
          type: string
        pet_id:
          type: string
        image_url:
          type: string
          format: uri
          description: Served only through an authenticated route or a short-lived signed URL; never a 
            public media URL.
        created_at:
          type: string
          format: date-time
      required:
      - id
      - pet_id
      - image_url
      - created_at
    PetPhotoList:
      type: array
      items:
        $ref: '#/components/schemas/PetPhoto'
    ObservationItem:
      type: object
      properties:
        category:
          type: string
          enum:
          - DIGESTIVE
          - EATING_DRINKING
          - ENERGY_BEHAVIOR
          - SKIN_PHYSICAL
          - OTHER
        symptom_code:
          type: string
          example: DIARRHEA
          description: Code from GET /symptoms.
        custom_description:
          type: string
          description: Required (non-blank) when symptom_code ends with _OTHER.
      required:
      - category
      - symptom_code
      allOf:
      - if:
          properties:
            symptom_code:
              pattern: _OTHER$
          required:
          - symptom_code
        then:
          required:
          - custom_description
          properties:
            custom_description:
              pattern: \S
    ObservationInput:
      type: object
      description: At least one observation item, normal_no_concerns=true, or a nonblank note must be 
        supplied. normal_no_concerns=true cannot be combined with symptom items. observed_at must not be in 
        the future (422 FUTURE_TIME). Multiple entries per pet/day are allowed.
      properties:
        observed_at:
          type: string
          format: date-time
          example: '2026-11-02T10:30:00+03:00'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/ObservationItem'
        normal_no_concerns:
          type: boolean
          default: false
        notes:
          type: string
          example: Soft stool this morning; drank less water.
      required:
      - observed_at
      anyOf:
      - required:
        - observations
        properties:
          observations:
            minItems: 1
      - required:
        - normal_no_concerns
        properties:
          normal_no_concerns:
            const: true
      - required:
        - notes
        properties:
          notes:
            pattern: \S
      allOf:
      - if:
          properties:
            normal_no_concerns:
              const: true
          required:
          - normal_no_concerns
        then:
          properties:
            observations:
              maxItems: 0
    ObservationUpdate:
      type: object
      description: Partial owner edit; only provided fields change. After applying the change the entry must
        still contain at least one observation item, normal_no_concerns=true, or a nonblank note; otherwise 
        422. normal_no_concerns=true cannot coexist with symptom items; observed_at must not be in the 
        future.
      properties:
        observed_at:
          type: string
          format: date-time
          example: '2026-11-02T10:30:00+03:00'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/ObservationItem'
        normal_no_concerns:
          type: boolean
          default: false
        notes:
          type: string
          example: Soft stool this morning; drank less water.
    Observation:
      type: object
      properties:
        id:
          type: string
          example: obs-1
        pet_id:
          type: string
          example: pet-1
        created_by_owner_id:
          type: string
          example: owner-1
        observed_at:
          type: string
          format: date-time
          example: '2026-11-02T10:30:00+03:00'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/ObservationItem'
        normal_no_concerns:
          type: boolean
          default: false
        notes:
          type: string
          example: Soft stool this morning; drank less water.
      required:
      - id
      - pet_id
      - created_by_owner_id
      - observed_at
    ObservationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null on the last page.
      required:
      - items
      - next_cursor
    SymptomCount:
      type: object
      properties:
        symptom_code:
          type: string
          example: DIARRHEA
        display_name:
          type: string
          example: Diarrhea
        count:
          type: integer
          minimum: 0
          example: 4
      required:
      - symptom_code
      - display_name
      - count
    TimelinePoint:
      type: object
      properties:
        date:
          type: string
          format: date
        symptom_code:
          type: string
        display_name:
          type: string
        reported_count:
          type: integer
          minimum: 0
      required:
      - date
      - symptom_code
      - display_name
      - reported_count
    DiaryStatistics:
      type: object
      description: Counts of owner-submitted observations, not medically verified illness incidence. No 
        entry does not imply good health.
      properties:
        pet_id:
          type: string
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        symptom_frequency:
          type: array
          items:
            $ref: '#/components/schemas/SymptomCount'
        symptom_timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePoint'
      required:
      - pet_id
      - from_date
      - to_date
      - symptom_frequency
      - symptom_timeline
    SymptomOption:
      type: object
      properties:
        code:
          type: string
          example: DIARRHEA
        category:
          type: string
          enum:
          - DIGESTIVE
          - EATING_DRINKING
          - ENERGY_BEHAVIOR
          - SKIN_PHYSICAL
          - OTHER
        display_name:
          type: string
          example: Diarrhea
      required:
      - code
      - category
      - display_name
    SymptomList:
      type: array
      items:
        $ref: '#/components/schemas/SymptomOption'
    MedicalRecordInput:
      type: object
      description: Clinical fields are optional; an empty diagnosis does not mean the pet is healthy.
      properties:
        visit_date:
          type: string
          format: date
        visit_type:
          type: string
          enum:
          - ROUTINE_CHECKUP
          - VACCINATION
          - ILLNESS
          - FOLLOW_UP
          - OTHER
        reason_for_visit:
          type: string
        clinical_findings:
          type: string
        diagnosis:
          type: string
        treatment:
          type: string
        prescribed_medication:
          type: string
        additional_clinical_notes:
          type: string
      required:
      - visit_date
      - visit_type
    MedicalRecordUpdate:
      type: object
      description: Partial veterinary edit; only provided fields change.
      properties:
        visit_date:
          type: string
          format: date
        visit_type:
          type: string
          enum:
          - ROUTINE_CHECKUP
          - VACCINATION
          - ILLNESS
          - FOLLOW_UP
          - OTHER
        reason_for_visit:
          type: string
        clinical_findings:
          type: string
        diagnosis:
          type: string
        treatment:
          type: string
        prescribed_medication:
          type: string
        additional_clinical_notes:
          type: string
    MedicalRecord:
      type: object
      properties:
        id:
          type: string
        pet_id:
          type: string
        veterinarian_id:
          type: string
        visit_date:
          type: string
          format: date
        visit_type:
          type: string
          enum:
          - ROUTINE_CHECKUP
          - VACCINATION
          - ILLNESS
          - FOLLOW_UP
          - OTHER
        reason_for_visit:
          type: string
        clinical_findings:
          type: string
        diagnosis:
          type: string
        treatment:
          type: string
        prescribed_medication:
          type: string
        additional_clinical_notes:
          type: string
