        field leaves it unchanged.'
      properties:
        vaccine_name:
          type: string
          example: Rabies vaccine
        administration_date:
          type: string
          format: date
        next_due_date:
          type:
          - string
          - 'null'
          format: date
          description: A manually entered date, or null to clear it (clearing removes the active reminder; 
            vaccination history is kept). No due date means no reminder.
        additional_notes:
          type: string
        previous_vaccination_id:
          type: string
